[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
authors = [{ name = "Shuqi Xiao" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pathspec>=0.12"]
description = "Find documents that may need review after source changes"
license = "MIT"
license-files = ["LICENSE"]
name = "docstale"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.1"

[project.scripts]
docstale = "docstale.cli:main"

# Upper bounds are deliberate: `ruff` selects ALL rules and `ty` treats every
# rule as an error, so a minor release of either turns unrelated CI runs red.
# `uv.lock` pins the exact versions; these bounds keep an unreviewed major or
# minor bump from entering the lock during a routine `uv lock --upgrade`.
[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<0.15",
  "ty>=0.0.1a19,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docstale"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
  "posix_only: requires POSIX filesystem or permission semantics",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
show_missing = true

[tool.coverage.run]
branch = true
source = ["src/docstale"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "DOC201",
  "DOC402",
  "E501",
  "EM101",
  "EM102",
  "FIX002",
  "ISC001",
  "PLR2004",
  "T201",
  "TD002",
  "TD003",
  "TRY003",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# `pytest.mark.parametrize` supplies its cases positionally, booleans included.
"tests/**" = ["D", "FBT001", "INP001", "PLR2004", "S101", "S603", "S607", "TC003"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["src", "tests"]
